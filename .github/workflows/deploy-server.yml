name: Deploy KB to Server

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build /kb/ version
        env:
          KB_BASE: /kb/
        run: npx vitepress build docs --outDir /tmp/kb-dist
      - name: Pack dist
        run: tar -czf /tmp/kb-dist.tar.gz -C /tmp/kb-dist .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install paramiko
        run: pip install paramiko
      - name: Deploy to server
        env:
          ALI_PWD: ${{ secrets.ALI_PWD }}
        run: python .github/scripts/deploy-kb.py /tmp/kb-dist.tar.gz
